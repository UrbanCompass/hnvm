version: 2.1
orbs:
  shellcheck: circleci/shellcheck@2.0.0
workflows:
  ci:
    jobs:
      - go-test
      # The jest suite against the Go binary: bin/* run dist/hnvm when it exists
      - parity
      - shellcheck/check:
          dir: '.'
  publish:
    jobs:
      - publish:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+/
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+/
jobs:
  go-test:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race ./...
  parity:
    docker:
      - image: cimg/go:1.24-node
    steps:
      - checkout
      - run: go build -o dist/hnvm ./cmd/hnvm
      - run:
          command: npm install
          working_directory: ./test
      - run:
          command: npm test
          working_directory: ./test
  release:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - run:
          name: Publish binaries to GitHub Releases
          command: |
            curl -sfL https://goreleaser.com/static/run | VERSION=v2.12.0 bash -s -- release --clean
      - run:
          name: Mirror binaries to Nexus
          command: |
            for f in .goreleaser-dist/hnvm_*.tar.gz .goreleaser-dist/checksums.txt; do
              curl --fail-with-body -sS -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --http1.1 \
                --upload-file "$f" \
                "${NEXUS_URL}/repository/generic-local/hnvm/${CIRCLE_TAG}/$(basename "$f")"
            done
      - run:
          name: Point the bootstrap shims at this release
          command: |
            git config user.name "hnvm release"
            git config user.email "hnvm-release@users.noreply.github.com"
            git fetch origin master
            git checkout -B master origin/master
            echo "${CIRCLE_TAG#v}" > lib/hnvm/bootstrap-version
            git commit -am "chore: Bootstrap hnvm ${CIRCLE_TAG}"
            git push origin master
  publish:
    docker:
      - image: cimg/base:2026.10-24.04
    working_directory: '~'
    steps:
      - checkout:
          path: hnvm
      - run:
          name: Create hnvm gzip artifact
          command: |
            tar -zcvf hnvm.tar.gz --exclude '.git/*' hnvm/
      - run:
          name: Upload hnvm gzip to Nexus
          command: |
            curl --fail-with-body -sS -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --http1.1 \
            --upload-file ~/hnvm.tar.gz \
            ${NEXUS_URL}/repository/generic-local/hnvm/${CIRCLE_TAG}/hnvm.tar.gz
      - run:
          name: Verify hnvm gzip exists in Nexus
          command: |
            curl -fsSI -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --http1.1 \
            ${NEXUS_URL}/repository/generic-local/hnvm/${CIRCLE_TAG}/hnvm.tar.gz
      - run:
          name: SHA-256
          when: on_success
          command: |
            echo "SHA-256: $(shasum --algorithm 256 hnvm.tar.gz)"
